<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Helvetica,Arial,sans-serif">
  <rect width="900" height="760" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">Supercapacitor Pulse Fixture — Schematic (every pin net-labeled)</text>
  <text x="24" y="49" font-size="11" fill="#666">3.3 V MCU (Teensy 3.0 / ESP32-WROVER) · charge rail 5 V · star ground at C1(−) · supercapacitors only, not Li-ion</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>

  <!-- rails -->
  <line x1="60" y1="70" x2="830" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <text x="64" y="62" font-size="12" font-weight="700" fill="#c0392b">+5V</text>
  <line x1="60" y1="700" x2="830" y2="700" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="64" y="716" font-size="12" font-weight="700" fill="#2c3e50">GND</text>
  <line x1="800" y1="700" x2="800" y2="710" stroke="#2c3e50" stroke-width="2"/>
  <line x1="789" y1="710" x2="811" y2="710" stroke="#2c3e50" stroke-width="2"/>
  <line x1="794" y1="716" x2="806" y2="716" stroke="#2c3e50" stroke-width="2"/>
  <line x1="798" y1="722" x2="802" y2="722" stroke="#2c3e50" stroke-width="2"/>

  <!-- ============ Q2 PNP (emitter up) ============ -->
  <circle cx="240" cy="180" r="30" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <line x1="228" y1="166" x2="228" y2="194" stroke="#111" stroke-width="3"/>
  <line x1="210" y1="180" x2="228" y2="180" stroke="#111" stroke-width="1.8"/>
  <line x1="240" y1="162" x2="228" y2="172" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="240" y1="162" x2="240" y2="146" stroke="#111" stroke-width="1.8"/>
  <line x1="228" y1="188" x2="240" y2="198" stroke="#111" stroke-width="1.8"/>
  <line x1="240" y1="198" x2="240" y2="214" stroke="#111" stroke-width="1.8"/>
  <line x1="240" y1="146" x2="240" y2="70" stroke="#333" stroke-width="1.6"/>
  <line x1="240" y1="214" x2="240" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="272" y="176" font-size="11" fill="#111">Q2 BC327</text>
  <text x="272" y="190" font-size="11" fill="#111">PNP</text>
  <text x="246" y="150" font-size="10" fill="#888">E</text>
  <text x="246" y="210" font-size="10" fill="#888">C</text>
  <text x="212" y="174" font-size="10" fill="#888">B</text>
  <circle cx="240" cy="250" r="3.5" fill="#333"/>
  <text x="248" y="244" font-size="10" fill="#555">VCHG</text>

  <!-- R3 -->
  <line x1="240" y1="250" x2="240" y2="260" stroke="#333" stroke-width="1.6"/>
  <rect x="228" y="260" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="240" y1="320" x2="240" y2="360" stroke="#333" stroke-width="1.6"/>
  <text x="258" y="296" font-size="11" fill="#111">R3 10Ω 1W</text>

  <!-- CAPH node -->
  <circle cx="240" cy="360" r="3.5" fill="#333"/>
  <text x="248" y="354" font-size="10" fill="#555">CAPH</text>
  <line x1="240" y1="360" x2="620" y2="360" stroke="#333" stroke-width="1.6"/>
  <!-- C1 -->
  <line x1="240" y1="360" x2="240" y2="400" stroke="#333" stroke-width="1.6"/>
  <line x1="220" y1="400" x2="260" y2="400" stroke="#111" stroke-width="2.6"/>
  <line x1="220" y1="414" x2="260" y2="414" stroke="#111" stroke-width="2.6"/>
  <line x1="240" y1="414" x2="240" y2="700" stroke="#333" stroke-width="1.6"/>
  <text x="266" y="404" font-size="11" fill="#111">C1 10F</text>
  <text x="266" y="418" font-size="10" fill="#888">2.7 V supercap</text>
  <!-- CH1 + A0 taps -->
  <circle cx="320" cy="360" r="3.5" fill="#c0392b"/>
  <text x="292" y="352" font-size="10" fill="#c0392b">CH1+</text>
  <circle cx="420" cy="360" r="3.5" fill="#333"/>
  <line x1="420" y1="360" x2="420" y2="320" stroke="#333" stroke-width="1.6"/>
  <text x="426" y="332" font-size="10" fill="#555">A0 (ADC)</text>

  <!-- ============ load branch ============ -->
  <line x1="620" y1="360" x2="620" y2="400" stroke="#333" stroke-width="1.6"/>
  <rect x="608" y="400" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="620" y1="460" x2="620" y2="478" stroke="#333" stroke-width="1.6"/>
  <text x="638" y="436" font-size="11" fill="#111">R4 2.2Ω 5W</text>
  <circle cx="620" cy="478" r="3.5" fill="#333"/>
  <text x="628" y="472" font-size="10" fill="#555">DRN</text>

  <!-- Q1 N-FET -->
  <circle cx="620" cy="512" r="30" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <line x1="606" y1="498" x2="606" y2="526" stroke="#111" stroke-width="2.6"/>
  <line x1="613" y1="498" x2="613" y2="526" stroke="#111" stroke-width="2"/>
  <line x1="590" y1="512" x2="606" y2="512" stroke="#111" stroke-width="1.8"/>
  <line x1="613" y1="504" x2="620" y2="496" stroke="#111" stroke-width="1.8"/>
  <line x1="620" y1="496" x2="620" y2="478" stroke="#111" stroke-width="1.8"/>
  <line x1="613" y1="520" x2="620" y2="528" stroke="#111" stroke-width="1.8"/>
  <line x1="620" y1="528" x2="620" y2="546" stroke="#111" stroke-width="1.8"/>
  <line x1="620" y1="546" x2="620" y2="580" stroke="#333" stroke-width="1.6"/>
  <text x="656" y="508" font-size="11" fill="#111">Q1 IRLZ44N</text>
  <text x="656" y="522" font-size="11" fill="#111">N-FET</text>
  <text x="626" y="482" font-size="10" fill="#888">D</text>
  <text x="626" y="542" font-size="10" fill="#888">S</text>
  <text x="592" y="506" font-size="10" fill="#888">G</text>
  <circle cx="620" cy="560" r="3.5" fill="#333"/>
  <line x1="620" y1="560" x2="660" y2="560" stroke="#c0392b" stroke-width="1.6"/>
  <text x="664" y="556" font-size="10" fill="#c0392b">CH2+</text>
  <text x="628" y="574" font-size="10" fill="#555">SRC</text>
  <rect x="608" y="580" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="620" y1="640" x2="620" y2="700" stroke="#333" stroke-width="1.6"/>
  <text x="638" y="616" font-size="11" fill="#111">R7 0.1Ω</text>

  <!-- gate network -->
  <line x1="590" y1="512" x2="560" y2="512" stroke="#333" stroke-width="1.6"/>
  <circle cx="560" cy="512" r="3.5" fill="#333"/>
  <text x="566" y="506" font-size="10" fill="#555">G1</text>
  <rect x="490" y="504" width="50" height="16" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="540" y1="512" x2="560" y2="512" stroke="#333" stroke-width="1.6"/>
  <line x1="490" y1="512" x2="460" y2="512" stroke="#333" stroke-width="1.6"/>
  <text x="494" y="498" font-size="10" fill="#888">R5 100Ω</text>
  <text x="438" y="516" font-size="10" fill="#2c6fbb">D9</text>
  <line x1="560" y1="512" x2="560" y2="560" stroke="#333" stroke-width="1.6"/>
  <rect x="548" y="560" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="560" y1="620" x2="560" y2="700" stroke="#333" stroke-width="1.6"/>
  <text x="578" y="594" font-size="11" fill="#111">R6 10k</text>

  <!-- ============ level shifter column (x=170) ============ -->
  <!-- R2 pull-up -->
  <rect x="158" y="90" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="170" y1="90" x2="170" y2="70" stroke="#333" stroke-width="1.6"/>
  <line x1="170" y1="150" x2="170" y2="180" stroke="#333" stroke-width="1.6"/>
  <text x="96" y="124" font-size="11" fill="#111">R2 10k</text>
  <text x="96" y="138" font-size="10" fill="#888">pull-up</text>
  <!-- B2 node -->
  <line x1="210" y1="180" x2="170" y2="180" stroke="#333" stroke-width="1.6"/>
  <circle cx="170" cy="180" r="3.5" fill="#333"/>
  <text x="130" y="174" font-size="10" fill="#555">B2</text>
  <!-- R8 -->
  <line x1="170" y1="180" x2="170" y2="380" stroke="#333" stroke-width="1.6"/>
  <rect x="158" y="380" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="170" y1="440" x2="170" y2="476" stroke="#333" stroke-width="1.6"/>
  <text x="96" y="414" font-size="11" fill="#111">R8 1k</text>
  <circle cx="170" cy="476" r="3.5" fill="#333"/>
  <text x="178" y="470" font-size="10" fill="#555">C3</text>

  <!-- Q3 NPN -->
  <circle cx="170" cy="510" r="30" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <line x1="158" y1="496" x2="158" y2="524" stroke="#111" stroke-width="3"/>
  <line x1="140" y1="510" x2="158" y2="510" stroke="#111" stroke-width="1.8"/>
  <line x1="158" y1="502" x2="170" y2="492" stroke="#111" stroke-width="1.8"/>
  <line x1="170" y1="492" x2="170" y2="476" stroke="#111" stroke-width="1.8"/>
  <line x1="158" y1="518" x2="170" y2="528" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="170" y1="528" x2="170" y2="544" stroke="#111" stroke-width="1.8"/>
  <line x1="170" y1="544" x2="170" y2="700" stroke="#333" stroke-width="1.6"/>
  <text x="202" y="506" font-size="11" fill="#111">Q3 2N3904</text>
  <text x="202" y="520" font-size="11" fill="#111">NPN</text>
  <text x="176" y="480" font-size="10" fill="#888">C</text>
  <text x="176" y="540" font-size="10" fill="#888">E</text>
  <text x="142" y="504" font-size="10" fill="#888">B</text>

  <!-- base network B3 -->
  <circle cx="140" cy="510" r="3.5" fill="#333"/>
  <text x="120" y="504" font-size="10" fill="#555">B3</text>
  <rect x="70" y="502" width="50" height="16" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="120" y1="510" x2="140" y2="510" stroke="#333" stroke-width="1.6"/>
  <line x1="70" y1="510" x2="50" y2="510" stroke="#333" stroke-width="1.6"/>
  <text x="74" y="496" font-size="10" fill="#888">R1 1k</text>
  <text x="28" y="514" font-size="10" fill="#2c6fbb">D8</text>
  <line x1="140" y1="510" x2="140" y2="560" stroke="#333" stroke-width="1.6"/>
  <rect x="128" y="560" width="24" height="60" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <line x1="140" y1="620" x2="140" y2="700" stroke="#333" stroke-width="1.6"/>
  <text x="94" y="594" font-size="11" fill="#111">R6b 100k</text>

  <!-- note -->
  <text x="360" y="740" font-size="11" fill="#2c3e50">R2 and R8 meet at B2 (Q2 base) — R2 is a pull-up to +5V, R8 runs to Q3's collector. This is NOT a voltage divider with a tap.</text>
</svg>
